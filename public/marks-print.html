<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marks Award Register – Print | DSVV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/print.css" />
  <style>
    body {
      background: #f1f5f9;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    @media screen {
      .preview-wrapper {
        padding: 32px 16px;
        display: flex;
        justify-content: center;
        overflow-x: auto;
      }
      .print-container {
        width: 100%;
        max-width: 297mm; /* Standard A4 Landscape */
        min-height: 210mm; /* Standard A4 Landscape height */
        margin: 0 auto;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 12px 40px -10px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.06);
        padding: 16mm 18mm;
        box-sizing: border-box;
      }
      .cie-table {
        width: 100%;
        table-layout: auto;
      }
      .cie-table tbody tr {
        height: 32px;
      }
    }
    @page {
      size: landscape;
      margin: 8mm 10mm;
    }
    @media print {
      @page {
        size: landscape;
        margin: 8mm 10mm;
      }
      *, html, body, .print-container, table, th, td, h1, h2, h3, p, span, div {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      }
      body {
        background: #fff !important;
        color: #000 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print { display: none !important; }
      .preview-wrapper {
        padding: 0 !important;
        display: block !important;
      }
      .print-container {
        box-shadow: none !important;
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
        border-radius: 0 !important;
        padding: 0 !important;
        min-height: auto !important;
      }
      .cie-table {
        width: 100% !important;
        table-layout: fixed !important;
      }
      .cie-table tbody tr {
        height: 26pt;
      }
    }
    .table-scroll-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    @media (max-width: 768px) {
      .preview-wrapper { padding: 8px; }
      .print-container { padding: 14px; border-radius: 8px; min-height: auto; }
    }
  </style>
</head>
<body>

  <!-- ── ACTION BAR ───────────────────────────────────────────── -->
  <div class="no-print glass-header sticky top-0 z-50 shadow-sm border-b border-slate-200">
    <div class="max-w-[297mm] mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      
      <div class="flex items-center gap-3 min-w-0">
        <a href="/dashboard.html" class="btn-core btn-secondary text-xs py-1.5 px-3">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          <span>Workspace</span>
        </a>
        <div class="h-4 w-px bg-slate-200"></div>
        <span id="actionTitle" class="text-xs sm:text-sm font-extrabold text-slate-800 truncate">Marks Award Register</span>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="window.print()" class="btn-core btn-primary-grad text-xs py-2 px-3.5 shadow-sm">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
          <span>Print Register</span>
        </button>
        <button onclick="window.print()" class="btn-core btn-gold-grad text-xs py-2 px-3.5 shadow-sm">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          <span>Save PDF</span>
        </button>
      </div>

    </div>
  </div>

  <div id="loadingState" class="flex items-center justify-center min-h-96 no-print">
    <div class="text-center">
      <div class="w-8 h-8 border-3 border-primary-200 border-t-primary-600 rounded-full animate-spin mx-auto mb-3" style="border-width:3px"></div>
      <p class="text-slate-500 text-xs font-bold">Compiling student grades…</p>
    </div>
  </div>

  <div id="previewWrapper" class="preview-wrapper hidden">
    <div class="print-container" id="printArea">

      <div class="sheet-header-flex sheet-header">
        <img src="/logo.png" alt="DSVV Logo" class="sheet-header-logo" onerror="this.style.display='none'" />
        <div class="sheet-header-text">
          <h1>Department of Computer Science</h1>
          <h2 class="mt-1 font-semibold">Formative & Midterm Examination <span class="mx-2 text-slate-300">|</span> Marks Award Register</h2>
          <h3 id="sheetSession">Session: —</h3>
        </div>
        <div class="header-flex-balance"></div>
      </div>

      <div class="sheet-meta">
        <div><strong>Course Code: </strong><span id="metaCourseCode">—</span></div>
        <div><strong>Program / Semester: </strong><span id="metaProgSem">—</span></div>
      </div>
      <div class="sheet-meta" style="margin-top:-4px; margin-bottom:12px;">
        <div><strong>Course Name: </strong><span id="metaCourseName">—</span></div>
        <div><strong>Faculty In-Charge: </strong><span id="metaFaculty">—</span></div>
      </div>

      <div class="table-scroll-wrap">
        <table class="cie-table" id="marksTable">
          <thead id="marksHead"></thead>
          <tbody id="marksBody"></tbody>
        </table>
      </div>

      <div class="sheet-footer">
        <div class="footer-sign">
          <div class="sign-line"></div>
          <p>Teacher's Signature</p>
        </div>
        <div class="footer-sign">
          <div class="sign-line"></div>
          <p>HoD's Signature</p>
        </div>
      </div>

    </div>
  </div>

  <script>
    const params  = new URLSearchParams(location.search);
    const program = params.get('program')  || '';
    const semester= params.get('semester') || '';
    const courseCode = params.get('courseCode') || '';
    const session = params.get('session') || sessionStorage.getItem('cie_session') || 'July – December 2026';

    document.getElementById('sheetSession').textContent = 'Session: ' + session;
    document.getElementById('metaProgSem').textContent  = `${program} / Semester ${semester}`;
    document.getElementById('metaCourseCode').textContent = courseCode;

    function getComponents(prog) {
      if ((prog||'').trim().toUpperCase() === 'MCA-DS') return [
        { key:'assignment', label:'Assignment', max:10 },
        { key:'seminar',    label:'Seminar',    max:10 },
        { key:'midterm',    label:'Mid Term',   max:20 }
      ];
      return [
        { key:'assignment', label:'Assignment',  max:15 },
        { key:'seminar',    label:'Seminar',     max:15 },
        { key:'quiz',       label:'Quiz / Viva', max:10 },
        { key:'midterm',    label:'Mid Term',    max:20 }
      ];
    }

    async function loadData() {
      if (!program || !semester || !courseCode) {
        document.getElementById('loadingState').innerHTML = '<p class="text-rose-600 font-bold text-xs">Missing parameters. Please select a course from Marks Entry.</p>';
        return;
      }
      try {
        const [coursesRes, studentsRes, marksRes] = await Promise.all([
          fetch(`/api/data/courses?program=${encodeURIComponent(program)}&semester=${encodeURIComponent(semester)}&session=${encodeURIComponent(session)}`),
          fetch(`/api/data/students?program=${encodeURIComponent(program)}&semester=${encodeURIComponent(semester)}&session=${encodeURIComponent(session)}`),
          fetch(`/api/marks?program=${encodeURIComponent(program)}&semester=${encodeURIComponent(semester)}&courseCode=${encodeURIComponent(courseCode)}&session=${encodeURIComponent(session)}`)
        ]);
        const courses  = await coursesRes.json();
        const students = await studentsRes.json();
        const marks    = await marksRes.json();

        const course = courses.find(c => c.course_code === courseCode) || {};
        document.getElementById('metaCourseName').textContent = course.course_name || courseCode;
        document.getElementById('metaFaculty').textContent    = course.faculty_name || '—';
        document.getElementById('actionTitle').textContent    = `${course.course_name || courseCode} — Marks Award Register`;

        const components = getComponents(program);
        const marksMap = {};
        marks.forEach(m => {
          if (!marksMap[m.scholar_id]) marksMap[m.scholar_id] = {};
          marksMap[m.scholar_id][m.component] = m.marks_obtained;
        });

        const maxTotal = components.reduce((s, c) => s + c.max, 0);

        document.getElementById('marksHead').innerHTML = `
          <tr>
            <th style="width:4%">S.No</th>
            <th style="width:10%">Scholar ID</th>
            <th style="width:18%">Candidate Name</th>
            ${components.map(c => `<th>${c.label}<br/><span style="font-size:8pt;font-weight:normal">(Max ${c.max})</span></th>`).join('')}
            <th style="width:10%">Total<br/><span style="font-size:8pt;font-weight:normal">(${maxTotal})</span></th>
            <th style="width:14%">Remarks</th>
          </tr>
        `;

        const tbody = document.getElementById('marksBody');
        tbody.innerHTML = '';
        students.forEach((s, i) => {
          const sm = marksMap[s.scholar_id] || {};
          let total = 0, hasAny = false;
          components.forEach(c => {
            const v = parseFloat(sm[c.key]);
            if (!isNaN(v)) { total += v; hasAny = true; }
          });
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="sno">${i + 1}</td>
            <td class="sid">${s.scholar_id}</td>
            <td class="sname">${s.student_name}</td>
            ${components.map(c => {
              const v = sm[c.key];
              return `<td>${v != null && v !== undefined && v !== '' ? v : '–'}</td>`;
            }).join('')}
            <td style="font-weight:700;color:#1c4c94">${hasAny ? total : '–'}</td>
            <td></td>
          `;
          tbody.appendChild(tr);
        });

        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('previewWrapper').classList.remove('hidden');
      } catch (err) {
        document.getElementById('loadingState').innerHTML = `<p class="text-rose-600 font-bold text-xs">Error loading data: ${err.message}</p>`;
      }
    }

    loadData();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bulk Print Sheets – CIE Tracker | DSVV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/print.css" />
  <style>
    body {
      background: #f1f5f9;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    @media screen {
      .preview-wrapper {
        padding: 32px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: auto;
      }
      .course-sheet {
        width: 100%;
        max-width: 297mm; /* Standard A4 Landscape */
        min-height: 210mm; /* Standard A4 Landscape height */
        margin: 0 auto 32px auto;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 12px 40px -10px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.06);
        padding: 16mm 18mm;
        box-sizing: border-box;
      }
      .cie-table {
        width: 100%;
        table-layout: auto;
      }
      .cie-table tbody tr {
        height: 32px;
      }
    }
    @page {
      size: landscape;
      margin: 8mm 10mm;
    }
    @media print {
      @page {
        size: landscape;
        margin: 8mm 10mm;
      }
      *, html, body, .course-sheet, table, th, td, h1, h2, h3, p, span, div {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      }
      body {
        background: #fff !important;
        color: #000 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print { display: none !important; }
      .preview-wrapper {
        padding: 0 !important;
        display: block !important;
      }
      .course-sheet {
        box-shadow: none !important;
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
        border-radius: 0 !important;
        padding: 0 !important;
        min-height: auto !important;
        page-break-after: always;
        break-after: page;
      }
      .course-sheet:last-child {
        page-break-after: avoid;
        break-after: avoid;
      }
      .cie-table {
        width: 100% !important;
        table-layout: fixed !important;
      }
      .cie-table tbody tr {
        height: 26pt;
      }
    }
    .table-scroll-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    @media (max-width: 768px) {
      .preview-wrapper { padding: 8px; }
      .course-sheet { padding: 14px; border-radius: 8px; min-height: auto; }
    }
  </style>
</head>
<body>

  <!-- ── ACTION BAR ───────────────────────────────────────────── -->
  <div class="no-print glass-header sticky top-0 z-50 shadow-sm border-b border-slate-200">
    <div class="max-w-[297mm] mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      
      <div class="flex items-center gap-3 min-w-0">
        <a href="/dashboard.html" class="btn-core btn-secondary text-xs py-1.5 px-3">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          <span>Workspace</span>
        </a>
        <div class="h-4 w-px bg-slate-200"></div>
        <div class="min-w-0">
          <span id="bulkTitle" class="text-xs sm:text-sm font-extrabold text-slate-800 truncate block">Bulk Generation</span>
          <span id="bulkSubtitle" class="text-[10px] text-slate-400 font-semibold block">All course evaluation sheets stacked</span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span id="sheetTypeBadge" class="badge-pill badge-blue text-[10px]">–</span>
        <button onclick="window.print()" class="btn-core btn-primary-grad text-xs py-2 px-3.5 shadow-sm">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
          <span>Print All</span>
        </button>
        <button onclick="window.print()" class="btn-core btn-gold-grad text-xs py-2 px-3.5 shadow-sm">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          <span>Save All PDF</span>
        </button>
      </div>

    </div>
  </div>

  <!-- Loading state -->
  <div id="loadingState" class="flex flex-col items-center justify-center min-h-96 gap-3 no-print">
    <div class="w-8 h-8 border-3 border-primary-200 border-t-primary-600 rounded-full animate-spin" style="border-width:3px"></div>
    <p class="text-slate-500 text-xs font-bold" id="loadingMsg">Loading all program courses…</p>
  </div>

  <!-- Error state -->
  <div id="errorState" class="hidden flex flex-col items-center justify-center min-h-96 gap-3 no-print">
    <svg class="w-10 h-10 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    <p class="text-slate-700 font-bold text-sm" id="errorMsg">No courses found.</p>
    <a href="/dashboard.html" class="text-primary-600 text-xs hover:underline font-bold">← Return to Workspace</a>
  </div>

  <!-- All sheets container -->
  <div id="allSheets" class="preview-wrapper hidden"></div>

  <script>
    const params    = new URLSearchParams(window.location.search);
    const program   = params.get('program')  || '';
    const semester  = params.get('semester') || '';
    const type      = params.get('type')     || 'signature';
    const session   = params.get('session')  || sessionStorage.getItem('cie_session') || 'July – December 2026';

    const isMarks   = type === 'marks';
    const typeLabel = isMarks ? 'Marks Award Register' : 'Signature Sheet';

    const badge = document.getElementById('sheetTypeBadge');
    badge.textContent = typeLabel;
    badge.className = isMarks ? 'badge-pill badge-gold text-[10px]' : 'badge-pill badge-blue text-[10px]';

    document.getElementById('bulkTitle').textContent = `${program} – Semester ${semester} | ${typeLabel}`;
    document.title = `Bulk ${typeLabel} – ${program} Sem ${semester}`;

    function getSubjects(prog) {
      const p = (prog || '').trim().toUpperCase();
      if (p === 'MCA-DS') {
        return [
          { label: 'Assignment',    max: 10 },
          { label: 'Seminar',       max: 10 },
          { label: 'Mid Term Exam', max: 20 }
        ];
      }
      return [
        { label: 'Assignment',    max: 15 },
        { label: 'Seminar',       max: 15 },
        { label: 'Quiz',          max: 10 },
        { label: 'Mid Term Exam', max: 20 }
      ];
    }

    function buildSignatureTable(students) {
      const subjects = getSubjects(program);
      const subjectW = Math.floor(74 / subjects.length);
      let html = `
        <div class="table-scroll-wrap">
          <table class="cie-table">
            <thead>
              <tr>
                <th style="width:4%">S.No</th>
                <th style="width:10%">Scholar ID</th>
                <th style="width:14%">Candidate Name</th>
                ${subjects.map(s => `<th style="width:${subjectW}%">${s.label} (${s.max})<br/><span style="font-size:8pt;font-weight:normal">Sign (Date & Time)</span></th>`).join('')}
              </tr>
            </thead>
            <tbody>`;
      students.forEach((s, i) => {
        html += `<tr>
          <td class="sno">${i + 1}</td>
          <td class="sid">${s.scholar_id}</td>
          <td class="sname">${s.student_name}</td>
          ${'<td></td>'.repeat(subjects.length)}
        </tr>`;
      });
      html += `</tbody></table></div>`;
      return html;
    }

    function buildMarksTable(students) {
      const subjects = getSubjects(program);
      const subjectW = Math.floor(74 / subjects.length);
      let html = `
        <div class="table-scroll-wrap">
          <table class="cie-table">
            <thead>
              <tr>
                <th rowspan="2" style="width:4%">S.No</th>
                <th rowspan="2" style="width:10%">Scholar ID</th>
                <th rowspan="2" style="width:14%">Candidate Name</th>
                ${subjects.map(s => `<th colspan="2" style="width:${subjectW}%">${s.label}<br/>(${s.max})</th>`).join('')}
              </tr>
              <tr>
                ${subjects.map(() => `<th style="font-weight:600;font-size:8pt;border-left:1pt solid rgba(255,255,255,0.3)">Marks</th><th style="font-weight:600;font-size:8pt;border-left:1pt solid rgba(255,255,255,0.3)">Sign</th>`).join('')}
              </tr>
            </thead>
            <tbody>`;
      students.forEach((s, i) => {
        html += `<tr>
          <td class="sno">${i + 1}</td>
          <td class="sid">${s.scholar_id}</td>
          <td class="sname">${s.student_name}</td>
          ${subjects.map(() => `<td style="border-right:1pt solid #1c4c94"></td><td></td>`).join('')}
        </tr>`;
      });
      html += `</tbody></table></div>`;
      return html;
    }

    function buildSheet(course, students, idx, total) {
      const headerLabel = isMarks
        ? 'Formative & Midterm Examination <span style="margin:0 8px;color:#aaa">|</span> Marks Award Register'
        : 'Formative & Midterm Examination <span style="margin:0 8px;color:#aaa">|</span> Signature Sheet';

      const table = isMarks ? buildMarksTable(students) : buildSignatureTable(students);

      return `
        <div class="print-container course-sheet">
          <div class="sheet-header-flex sheet-header">
            <img src="/logo.png" alt="DSVV Logo" class="sheet-header-logo" onerror="this.style.display='none'" />
            <div class="sheet-header-text">
              <h1>Department of Computer Science</h1>
              <h2 class="mt-1 font-semibold">${headerLabel}</h2>
              <h3>Session: ${session}</h3>
            </div>
            <div class="header-flex-balance"></div>
          </div>

          <div class="sheet-meta">
            <div><strong>Course Code:</strong> ${course.course_code}</div>
            <div><strong>Course Name:</strong> ${course.course_name}</div>
            <div><strong>Program / Semester:</strong> ${program} / Semester ${semester}</div>
          </div>
          <div class="sheet-meta" style="margin-top:-4px;margin-bottom:8px;">
            <div><strong>Faculty In-Charge:</strong> ${course.faculty_name || '–'}</div>
            <div><strong>Total Enrolled:</strong> ${students.length}</div>
            <div></div>
          </div>

          ${table}

          <div class="sheet-footer">
            <div class="footer-sign">
              <div class="sign-line"></div>
              <p>Teacher's Signature</p>
            </div>
            <div class="footer-sign">
              <div class="sign-line"></div>
              <p>HoD's Signature</p>
            </div>
          </div>
        </div>`;
    }

    async function loadAll() {
      if (!program || !semester) {
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('errorState').classList.remove('hidden');
        document.getElementById('errorMsg').textContent = 'Missing program or semester parameter.';
        return;
      }

      try {
        const cRes = await fetch(`/api/data/courses?program=${encodeURIComponent(program)}&semester=${encodeURIComponent(semester)}&session=${encodeURIComponent(session)}`);
        const courses = await cRes.json();

        if (!courses.length) {
          document.getElementById('loadingState').classList.add('hidden');
          document.getElementById('errorState').classList.remove('hidden');
          document.getElementById('errorMsg').textContent = `No courses registered for ${program}, Semester ${semester}.`;
          return;
        }

        document.getElementById('loadingMsg').textContent = `Loading enrolled candidates for ${courses.length} courses…`;
        const sRes = await fetch(`/api/data/students?program=${encodeURIComponent(program)}&semester=${encodeURIComponent(semester)}&session=${encodeURIComponent(session)}`);
        const students = await sRes.json();

        const container = document.getElementById('allSheets');
        container.innerHTML = courses.map((c, i) => buildSheet(c, students, i, courses.length)).join('');

        document.getElementById('loadingState').classList.add('hidden');
        container.classList.remove('hidden');
      } catch (err) {
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('errorState').classList.remove('hidden');
        document.getElementById('errorMsg').textContent = `Error: ${err.message}`;
      }
    }

    loadAll();
  </script>
</body>
</html>

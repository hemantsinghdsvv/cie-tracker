<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bulk Download – CIE Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/print.css" />
  <style>
    body { font-family: 'Inter', sans-serif; background: #f0f4f8; }

    @media screen {
      .preview-wrapper { padding: 16px; }
      .course-sheet { margin-bottom: 32px; }
    }

    @media print {
      body { background: #fff; }
      .preview-wrapper { padding: 0; }
      .no-print { display: none !important; }
      .print-container { box-shadow: none; max-width: 100%; margin: 0; border-radius: 0; padding: 0; }
      /* Each course sheet starts on a new page */
      .course-sheet { page-break-after: always; break-after: page; }
      .course-sheet:last-child { page-break-after: avoid; break-after: avoid; }
    }

    /* ── Table scrolls horizontally on mobile ────── */
    .table-scroll-wrap { 
      width: 100%;
      overflow-x: auto; 
      -webkit-overflow-scrolling: touch; 
    }
  </style>
</head>
<body>

  <!-- Action Bar -->
  <div class="no-print bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center gap-3">
      <a href="/dashboard.html" class="flex items-center gap-1.5 text-slate-500 hover:text-slate-800 text-sm transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Back
      </a>
      <div class="h-4 w-px bg-slate-200"></div>
      <div class="flex-1 min-w-0">
        <span id="bulkTitle" class="text-slate-700 text-sm font-semibold truncate block">Bulk Download</span>
        <span id="bulkSubtitle" class="text-slate-400 text-xs"></span>
      </div>
      <span id="sheetTypeBadge" class="text-xs px-2.5 py-1 rounded-full font-semibold"></span>
      <button onclick="window.print()"
        class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
        Print All
      </button>
      <button onclick="window.print()"
        class="flex items-center gap-2 bg-amber-500 hover:bg-amber-600 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        Download All PDF
      </button>
    </div>
  </div>

  <!-- Loading state -->
  <div id="loadingState" class="flex flex-col items-center justify-center min-h-96 gap-4 no-print">
    <div class="w-10 h-10 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin" style="border-width:3px"></div>
    <p class="text-slate-500 text-sm" id="loadingMsg">Loading courses...</p>
  </div>

  <!-- Error state -->
  <div id="errorState" class="hidden flex flex-col items-center justify-center min-h-96 gap-3 no-print">
    <svg class="w-12 h-12 text-red-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    <p class="text-slate-600 font-semibold" id="errorMsg">No courses found.</p>
    <a href="/dashboard.html" class="text-blue-600 text-sm hover:underline">← Go back to Dashboard</a>
  </div>

  <!-- All sheets go here -->
  <div id="allSheets" class="preview-wrapper hidden"></div>

  <script>
    const params    = new URLSearchParams(window.location.search);
    const program   = params.get('program')  || '';
    const semester  = params.get('semester') || '';
    const type      = params.get('type')     || 'signature'; // 'signature' | 'marks'
    const session   = params.get('session')  || sessionStorage.getItem('cie_session') || 'July – December 2026';

    const isMarks   = type === 'marks';
    const typeLabel = isMarks ? 'Marks Award Sheet' : 'Signature Sheet';

    // Set badge
    const badge = document.getElementById('sheetTypeBadge');
    badge.textContent = typeLabel;
    badge.className = isMarks
      ? 'text-xs px-2.5 py-1 rounded-full font-semibold bg-amber-100 text-amber-700'
      : 'text-xs px-2.5 py-1 rounded-full font-semibold bg-blue-100 text-blue-700';

    document.getElementById('bulkTitle').textContent = `${program} – Semester ${semester} | ${typeLabel}`;
    document.getElementById('bulkSubtitle').textContent = 'All courses stacked for bulk printing';
    document.title = `Bulk ${typeLabel} – ${program} Sem ${semester}`;

    // ── Table Builders ────────────────────────────────────────────────────────

    // Program-specific subject config (mirrors generate.html)
    function getSubjects(prog) {
      const p = (prog || '').trim().toUpperCase();
      if (p === 'MCA-DS') {
        return [
          { label: 'Assignment',    max: 10 },
          { label: 'Seminar',       max: 10 },
          { label: 'Mid Term Exam', max: 20 }
        ];
      }
      return [
        { label: 'Assignment',    max: 15 },
        { label: 'Seminar',       max: 15 },
        { label: 'Quiz',          max: 10 },
        { label: 'Mid Term Exam', max: 20 }
      ];
    }

    function buildSignatureTable(students) {
      const subjects = getSubjects(program);
      const subjectW = Math.floor(74 / subjects.length);
      let html = `
        <div class="table-scroll-wrap">
          <table class="cie-table">
            <thead>
              <tr>
                <th style="width:4%">S.No</th>
                <th style="width:9%">Scholar ID</th>
                <th style="width:13%">Name</th>
                ${subjects.map(s => `<th style="width:${subjectW}%">${s.label} (${s.max})<br/><span style="font-size:8pt;font-weight:normal">Sign (Date and Time)</span></th>`).join('')}
              </tr>
            </thead>
            <tbody>`;
      students.forEach((s, i) => {
        html += `<tr>
          <td class="sno">${i + 1}</td>
          <td class="sid">${s.scholar_id}</td>
          <td class="sname">${s.student_name}</td>
          ${'<td></td>'.repeat(subjects.length)}
        </tr>`;
      });
      html += `</tbody></table></div>`;
      return html;
    }

    function buildMarksTable(students) {
      const subjects = getSubjects(program);
      const subjectW = Math.floor(74 / subjects.length);
      let html = `
        <div class="table-scroll-wrap">
          <table class="cie-table">
            <thead>
              <tr>
                <th rowspan="2" style="width:4%">S.No</th>
                <th rowspan="2" style="width:9%">Scholar ID</th>
                <th rowspan="2" style="width:13%">Name</th>
                ${subjects.map(s => `<th colspan="2" style="width:${subjectW}%">${s.label}<br/>(${s.max})</th>`).join('')}
              </tr>
              <tr>
                ${subjects.map(() => `<th style="font-weight:600;font-size:8pt;border-left:1pt solid rgba(255,255,255,0.3)">Marks</th><th style="font-weight:600;font-size:8pt;border-left:1pt solid rgba(255,255,255,0.3)">Sign</th>`).join('')}
              </tr>
            </thead>
            <tbody>`;
      students.forEach((s, i) => {
        html += `<tr>
          <td class="sno">${i + 1}</td>
          <td class="sid">${s.scholar_id}</td>
          <td class="sname">${s.student_name}</td>
          ${subjects.map(() => `<td style="border-right:1pt solid #1c4c94"></td><td></td>`).join('')}
        </tr>`;
      });
      html += `</tbody></table></div>`;
      return html;
    }

    function buildSheet(course, students, idx, total) {
      const headerLabel = isMarks
        ? 'Formative & Midterm Examination <span style="margin:0 8px;color:#aaa">|</span> Marks Award Sheet'
        : 'Formative & Midterm Examination <span style="margin:0 8px;color:#aaa">|</span> Signature Sheet';

      const table = isMarks ? buildMarksTable(students) : buildSignatureTable(students);

      return `
        <div class="print-container course-sheet">
          <!-- Header -->
          <div class="sheet-header-flex sheet-header">
            <img src="/logo.png" alt="DSVV Logo" class="sheet-header-logo" onerror="this.style.display='none'" />
            <div class="sheet-header-text">
              <h1>Department of Computer Science</h1>
              <h2 class="mt-1 font-semibold">${headerLabel}</h2>
              <h3>Session: ${session}</h3>
            </div>
            <div class="header-flex-balance"></div>
          </div>

          <!-- Meta -->
          <div class="sheet-meta">
            <div><strong>Course Code:</strong> ${course.course_code}</div>
            <div><strong>Course Name:</strong> ${course.course_name}</div>
            <div><strong>Program / Semester:</strong> ${program} / Semester ${semester}</div>
          </div>
          <div class="sheet-meta" style="margin-top:-4px;margin-bottom:8px;">
            <div><strong>Faculty:</strong> ${course.faculty_name || '–'}</div>
            <div><strong>Total Students:</strong> ${students.length}</div>
            <div></div>
          </div>

          <!-- Table -->
          ${table}

          <!-- Footer -->
          <div class="sheet-footer">
            <div class="footer-sign">
              <div class="sign-line"></div>
              <p>Teacher's Signature</p>
            </div>
            <div class="footer-sign">
              <div class="sign-line"></div>
              <p>HoD's Signature</p>
            </div>
          </div>
        </div>`;
    }

    // ── Load and Render ───────────────────────────────────────────────────────

    async function loadAll() {
      if (!program || !semester) {
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('errorState').classList.remove('hidden');
        document.getElementById('errorMsg').textContent = 'Missing program or semester parameter.';
        return;
      }

      try {
        // Fetch all courses for this program+semester
        const cRes = await fetch(`/api/data/courses?program=${encodeURIComponent(program)}&semester=${encodeURIComponent(semester)}`);
        const courses = await cRes.json();

        if (!courses.length) {
          document.getElementById('loadingState').classList.add('hidden');
          document.getElementById('errorState').classList.remove('hidden');
          document.getElementById('errorMsg').textContent = `No courses found for ${program}, Semester ${semester}.`;
          return;
        }

        // Fetch students once (same for all courses in same program+semester)
        document.getElementById('loadingMsg').textContent = `Loading students for ${courses.length} courses...`;
        const sRes = await fetch(`/api/data/students?program=${encodeURIComponent(program)}&semester=${encodeURIComponent(semester)}`);
        const students = await sRes.json();

        // Render all sheets
        const container = document.getElementById('allSheets');
        container.innerHTML = courses.map((c, i) => buildSheet(c, students, i, courses.length)).join('');

        document.getElementById('loadingState').classList.add('hidden');
        container.classList.remove('hidden');

      } catch (err) {
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('errorState').classList.remove('hidden');
        document.getElementById('errorMsg').textContent = `Error: ${err.message}`;
      }
    }

    loadAll();
  </script>

  <footer class="no-print" style="max-width: 800px; margin: 40px auto; padding: 20px; border-top: 1px solid #e2e8f0; text-align: center;">
    <p style="font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.1em; line-height: 1.6;">
      Powered by:<br/>
      <span style="font-weight: 700; color: #475569;">Software Development Cell</span><br/>
      Dev Sanskriti Vishwavidyalaya, Haridwar
    </p>
  </footer>
</body>
</html>

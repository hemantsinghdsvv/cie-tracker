<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CIE Tracker – Login | Dev Sanskriti Vishwavidyalaya</title>
  <meta name="description" content="CIE Tracker login portal for faculty of Dev Sanskriti Vishwavidyalaya." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .gradient-bg {
      background: linear-gradient(135deg, #1c4c94 0%, #0d2854 50%, #1c4c94 100%);
      min-height: 100vh;
    }
    .glass {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .input-field {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      transition: all 0.2s;
    }
    .input-field:focus {
      outline: none;
      border-color: #f59e0b;
      background: rgba(255,255,255,0.1);
      box-shadow: 0 0 0 3px rgba(245,158,11,0.15);
    }
    .input-field::placeholder { color: rgba(255,255,255,0.35); }
    .btn-primary {
      background: linear-gradient(135deg, #e6b115, #fdc82c);
      color: #0d2854 !important;
      transition: all 0.2s;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(253, 200, 44, 0.35);
    }
    .btn-primary:active { transform: translateY(0); }
    .logo-ring {
      border: 2px solid rgba(253, 200, 44, 0.5);
      animation: pulse-ring 2s infinite;
    }
    @keyframes pulse-ring {
      0%,100% { box-shadow: 0 0 0 0 rgba(253, 200, 44, 0.3); }
      50% { box-shadow: 0 0 0 12px rgba(253, 200, 44, 0); }
    }
    .shake { animation: shake 0.4s ease; }
    @keyframes shake {
      0%,100%{ transform:translateX(0); }
      20%{ transform:translateX(-8px); }
      40%{ transform:translateX(8px); }
      60%{ transform:translateX(-5px); }
      80%{ transform:translateX(5px); }
    }
    /* Subtle star particles */
    .particle { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.5); animation: float linear infinite; }
    @keyframes float {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 0.5; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }
  </style>
</head>
<body class="gradient-bg flex items-center justify-center relative overflow-hidden">

  <!-- Floating particles -->
  <div id="particles" class="absolute inset-0 pointer-events-none"></div>

  <div class="relative z-10 w-full max-w-md px-4">
    <!-- University Logo / Badge -->
    <div class="text-center mb-6">
      <div class="mb-4">
        <img src="/logo_white.png" alt="DSVV Logo" class="w-auto h-14 object-contain mx-auto" onerror="this.src='/logo.png'" />
      </div>
      <h1 class="text-white font-bold text-xl tracking-wide leading-tight">Department of Computer Science</h1>
      <p class="text-[var(--dsvv-yellow)] text-sm mt-1" style="color: #fdc82c;">CIE Tracker System</p>
    </div>

    <!-- Login Card -->
    <div class="glass rounded-2xl p-8 shadow-2xl">


      <div id="error-msg" class="hidden mb-4 text-sm text-red-300 bg-red-900/30 border border-red-500/30 rounded-lg px-4 py-3 flex items-center gap-2">
        <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
        <span id="error-text">Invalid credentials</span>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="text-slate-300 text-sm font-medium block mb-1.5">Username</label>
          <input id="username" type="text" placeholder="e.g. computer.science"
            class="input-field w-full rounded-lg px-4 py-3 text-sm" autocomplete="username" />
        </div>
        <div>
          <label class="text-slate-300 text-sm font-medium block mb-1.5">Password</label>
          <div class="relative">
            <input id="password" type="password" placeholder="Enter your password"
              class="input-field w-full rounded-lg px-4 py-3 text-sm pr-10" autocomplete="current-password" />
            <button type="button" id="togglePwd"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition-colors">
              <svg id="eyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" id="submitBtn"
          class="btn-primary w-full text-white font-semibold py-3 rounded-lg text-sm flex items-center justify-center gap-2 mt-2">
          <span id="btnText">Sign In</span>
          <svg id="btnSpinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
          </svg>
        </button>
      </form>

      <style>
        :root {
          --dsvv-blue: #1c4c94;
          --dsvv-yellow: #fdc82c;
        }
        .input-field:focus {
          outline: none;
          border-color: var(--dsvv-yellow);
          background: rgba(255,255,255,0.1);
          box-shadow: 0 0 0 3px rgba(253, 200, 44, 0.15);
        }
      </style>

      <div class="mt-6 pt-5 border-t border-white/10 text-center">
        <p class="text-xs text-slate-400 tracking-wide font-medium" style="color: rgba(253, 200, 44, 0.8)">
          Powered by Software Development Cell, Dev Sanskriti Vishwavidyalaya
        </p>
      </div>

  <script>
    // Particles
    const container = document.getElementById('particles');
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      const size = Math.random() * 3 + 1;
      p.className = 'particle';
      p.style.cssText = `
        width:${size}px; height:${size}px;
        left:${Math.random()*100}%;
        animation-duration:${Math.random()*20+10}s;
        animation-delay:${Math.random()*15}s;
      `;
      container.appendChild(p);
    }

    // Toggle password
    document.getElementById('togglePwd').addEventListener('click', () => {
      const pwd = document.getElementById('password');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
    });

    // Login form
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errDiv = document.getElementById('error-msg');
      const errText = document.getElementById('error-text');
      const btn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const spinner = document.getElementById('btnSpinner');

      if (!username || !password) {
        errText.textContent = 'Please enter both username and password.';
        errDiv.classList.remove('hidden');
        return;
      }

      btnText.textContent = 'Signing in…';
      spinner.classList.remove('hidden');
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          sessionStorage.setItem('cie_user', username);
          window.location.href = '/dashboard.html';
        } else {
          errText.textContent = data.message || 'Invalid credentials.';
          errDiv.classList.remove('hidden');
          document.getElementById('loginForm').classList.add('shake');
          setTimeout(() => document.getElementById('loginForm').classList.remove('shake'), 400);
        }
      } catch {
        errText.textContent = 'Connection error. Please try again.';
        errDiv.classList.remove('hidden');
      } finally {
        btnText.textContent = 'Sign In';
        spinner.classList.add('hidden');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
